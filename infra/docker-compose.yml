# NYC MobilityPulse - local Kafka (single KRaft broker, no ZooKeeper).
# Usage (from project root):  docker compose -f infra/docker-compose.yml up -d
# Optional UI:                docker compose -f infra/docker-compose.yml --profile ui up -d   -> http://localhost:8080
# Host clients (producer, Spark) use localhost:9092; containers use kafka:29092.
name: mobilitypulse

services:
  kafka:
    image: apache/kafka:3.7.1
    container_name: mp-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_MESSAGE_MAX_BYTES: 2097152
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  kafka-init:
    build:
      context: ./kafka
      dockerfile: Dockerfile
    image: mobilitypulse/kafka-init:3.7.1
    container_name: mp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka:29092
      TRIPS_TOPIC: ${TRIPS_TOPIC:-taxi-trips}
      DLQ_TOPIC: ${DLQ_TOPIC:-taxi-trips-dlq}
      TRIPS_PARTITIONS: ${TRIPS_PARTITIONS:-4}
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: mp-kafka-ui
    profiles: ["ui"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: mobilitypulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
