[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilitypulse"
version = "0.1.0"
description = "NYC MobilityPulse: scalable taxi demand forecasting and mobility anomaly detection (DA231O, The Petabyte Pack)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  {name = "Mohammad Ayan Khan"},
  {name = "K Srikar Siddarth"},
  {name = "Chandana N"},
  {name = "Ritesh T Patil"},
]
dependencies = [
  "pyspark==3.5.3",
  "pyyaml>=6",
  "requests>=2.31",
  "truststore>=0.9",
  "pandas>=2.1,<2.4",
  "pyarrow>=15,<22",
  "numpy>=1.26,<2.1",
  "confluent-kafka>=2.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "streamlit>=1.50",
  "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: end-to-end tests that run the full Spark pipeline on synthetic data (slower)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/mobilitypulse"]
omit = ["src/mobilitypulse/serving/dashboard.py"]
