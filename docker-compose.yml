# M1 — Infrastructure: single-broker Kafka (KRaft, no ZooKeeper), topic creation,
# and an optional Kafka UI. Spark and the producers are added in later milestones.
#
# Start:   docker compose up -d kafka kafka-init
# With UI: docker compose --profile ui up -d

name: nyc-taxi-stream

# M2 — producers. One image, one service per dataset. Not started by default:
#   docker compose --profile producers up producer-green
#   MAX_RECORDS=1000 REPLAY_SPEEDUP=0 QUALITY_PROFILE=clean docker compose --profile producers up producer-yellow
# Empty env values fall back to stream-config.yaml.
x-producer: &producer
  profiles: ["producers"]
  build:
    context: ./producer
    args:
      PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
  depends_on:
    kafka-init:
      condition: service_completed_successfully
  environment: &producer-env
    KAFKA_BOOTSTRAP: kafka:29092
    CONFIG_PATH: /config/stream-config.yaml
    DATA_DIR: /data
    STATS_DIR: /output/producer-stats
    REPLAY_SPEEDUP: ${REPLAY_SPEEDUP:-}
    MAX_RECORDS: ${MAX_RECORDS:-}
    QUALITY_PROFILE: ${QUALITY_PROFILE:-}
  volumes:
    - ./data:/data:ro
    - ./output:/output
    - ${STREAM_CONFIG:-./stream-config.yaml}:/config/stream-config.yaml:ro
  restart: "no"

services:
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-3.9.0}
    container_name: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      # 29092 = containers on the compose network, 9092 = tools on the host
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics come from stream-config.yaml only
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    build:
      context: ./kafka-init
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CONFIG_PATH: /config/stream-config.yaml
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ${STREAM_CONFIG:-./stream-config.yaml}:/config/stream-config.yaml:ro
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION:-v0.7.2}
    container_name: kafka-ui
    profiles: ["ui"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"

  # M3/M4 — Spark job: reads the four raw topics, writes Silver (/output/stream/silver, silver_invalid) and the Gold marts (/output/stream/gold).
  #   docker compose --profile spark up -d spark-job         # keeps running (processing_time trigger)
  #   TRIGGER_MODE=available_now docker compose --profile spark up spark-job   # process what is in Kafka, then exit
  # Needs ~2 GB for the Spark driver on top of Kafka; see installation.md for WSL memory settings.
  spark-job:
    build:
      context: ./spark
    container_name: spark-job
    profiles: ["spark"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      CONFIG_PATH: /config/stream-config.yaml
      DATASETS_PATH: /config/datasets.yaml
      TRIGGER_MODE: ${TRIGGER_MODE:-}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
    volumes:
      - ./data:/data:ro
      - ./output:/output
      - ${STREAM_CONFIG:-./stream-config.yaml}:/config/stream-config.yaml:ro
      - ./producer/datasets.yaml:/config/datasets.yaml:ro
    restart: "no"

  producer-yellow:
    <<: *producer
    environment:
      <<: *producer-env
      DATASET: yellow

  producer-green:
    <<: *producer
    environment:
      <<: *producer-env
      DATASET: green

  producer-fhv:
    <<: *producer
    environment:
      <<: *producer-env
      DATASET: fhv

  producer-hvfhv:
    <<: *producer
    environment:
      <<: *producer-env
      DATASET: hvfhv

volumes:
  kafka-data:
